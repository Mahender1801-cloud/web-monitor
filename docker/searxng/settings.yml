# SearXNG configuration for keyword-rank tracking.
#
# Two changes from the defaults, both required for this to be usable as an API:
#   json format   the default build serves HTML only, and the script needs JSON
#   limiter off   the limiter exists to stop strangers abusing a public
#                 instance; this one is bound to 127.0.0.1 and serves one script
use_default_settings: true

server:
  secret_key: "local-only-not-a-secret"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en-IN"
  formats:
    - html
    - json

# Keep the request looking like a browser. SearXNG's own defaults are fine, but
# an explicit timeout stops one slow engine holding up the whole query — the
# merge proceeds with whoever answered.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
