# SearXNG configuration for keyword-rank tracking.
#
# Two changes from the defaults, both required for this to be usable as an API:
#   json format   the default build serves HTML only, and the script needs JSON
#   limiter off   the limiter exists to stop strangers abusing a public
#                 instance; this one is bound to 127.0.0.1 and serves one script
use_default_settings: true

server:
  secret_key: "local-only-not-a-secret"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en-IN"
  formats:
    - html
    - json

# Keep the request looking like a browser. SearXNG's own defaults are fine, but
# an explicit timeout stops one slow engine holding up the whole query — the
# merge proceeds with whoever answered.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

# The plain Google WEB engine is deliberately NOT enabled.
#
# It ships with SearXNG but its own default settings mark it inactive: true,
# and the reason is the same one this project already hit — Google blocks
# metasearch instances. Forcing it on was tried: with inactive:false it loads
# into the config, then returns zero results for every query and reports no
# error at all, which is worse than being absent because it silently costs a
# timeout on every search.
#
# So the Google-sourced results here come from "google cse" — Google's index
# through the Programmable Search interface. That is real Google data and it is
# NOT google.com's organic ranking; the two can order the same page differently.
# scripts/serp_validate.mjs measures how far apart they are on this shop's own
# keywords, using Search Console as the truth.
