name: Synthetic checkout

# Walks the real purchase path in a real browser. Runs hourly because a broken
# add-to-cart is a revenue outage — the 5x/day cadence of the main monitor would
# leave up to ~5 hours of silent breakage.
on:
  schedule:
    # Deliberately odd minutes rather than a round number, and only every other
    # hour: an exact hourly hit at :00 looks like a machine and adds needless load.
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (chromium only)
        run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - name: Stagger the start
        # Random 0-4 minute offset so runs never land on the same second twice.
        run: sleep $((RANDOM % 240))
      - name: Walk the purchase path
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STORE_URL:            https://hashtageyewears.com
        run: node scripts/synthetic.mjs
